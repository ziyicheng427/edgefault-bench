[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "edgefault-bench"
version = "1.0.0"
description = "Reproducible cross-condition and resource-efficient fault diagnosis benchmark"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Ziyi Cheng" }]
dependencies = [
  "numpy>=1.26,<3",
  "scikit-learn>=1.4,<2",
  "scipy>=1.11,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<9",
  "pytest-cov>=5.0,<7",
  "ruff>=0.6,<1",
]
deep-learning = ["torch>=2.2,<3"]

[project.scripts]
edgefault-smoke = "edgefault_bench.smoke:main"
edgefault-download-hust = "edgefault_bench.download:main"
edgefault-download-mehran = "edgefault_bench.download_mehran:main"
edgefault-run-features = "edgefault_bench.experiments.features:main"
edgefault-run-neural = "edgefault_bench.experiments.neural:main"
edgefault-run-robustness = "edgefault_bench.experiments.robustness:main"
edgefault-benchmark-hardware = "edgefault_bench.hardware:main"
edgefault-export-demo = "edgefault_bench.demo:export_main"
edgefault-infer = "edgefault_bench.demo:infer_main"
edgefault-verify-demo = "edgefault_bench.demo:verify_main"
edgefault-summarize = "edgefault_bench.reporting:main"
edgefault-audit-task = "edgefault_bench.audit:main"

[tool.hatch.build.targets.wheel]
packages = ["src/edgefault_bench"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
