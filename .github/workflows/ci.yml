name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v5.1.0
      - uses: astral-sh/setup-uv@v8.3.2
      - name: Set up Python
        run: uv python install ${{ matrix.python-version }}
      - name: Install dependencies
        run: uv sync --extra dev --extra deep-learning
      - name: Lint
        run: uv run ruff check .
      - name: Test
        run: uv run pytest
      - name: Install independent example plugin
        run: uv pip install --python .venv/bin/python --no-deps ./examples/edgefault-example-plugin
      - name: Audit installed plugin entry points
        run: |
          .venv/bin/python -m edgefault_bench.cli plugin list
          .venv/bin/python -m edgefault_bench.cli plugin list --kind model
          .venv/bin/python -m edgefault_bench.cli plugin validate \
            --manifest examples/edgefault-example-plugin/example_manifest.json
          .venv/bin/python -m edgefault_bench.cli plugin validate-model \
            --model example_centroid_classifier
      - name: Execute installed model plugin
        run: |
          .venv/bin/python -m edgefault_bench.cli benchmark run \
            --task examples/edgefault-example-plugin/example_task.json \
            --features examples/edgefault-example-plugin/prepared_features.json \
            --model example_centroid_classifier \
            --output "${RUNNER_TEMP}/example-plugin-result.json" \
            --latency-warmup 1 \
            --latency-repeats 3
          .venv/bin/python -m edgefault_bench.cli results validate \
            "${RUNNER_TEMP}/example-plugin-result.json"
